name: Archive

# Archive → Export（iOS は IPA、macOS は pkg）まで通ることを確認する（アップロードはしない）。手動実行のみ。
# main への push では Build だけを実行する（main には develop / release/** で Upload を通したものがマージされるため）。
# develop / release/** は upload.yml が Archive を含む。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    uses: ./.github/workflows/_archive.yml
    with:
      platform: iOS
      upload: false
    secrets: inherit

  archive-macos:
    # iOS とは別のジョブにし、macOS が失敗しても iOS の確認は止めない
    if: vars.ENABLE_MACOS_DELIVERY != 'false'
    uses: ./.github/workflows/_archive.yml
    with:
      platform: macOS
      upload: false
    secrets: inherit
