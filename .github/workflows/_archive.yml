# Archive → Export（iOS は IPA、macOS は pkg）（→ App Store Connect へアップロード）の共通処理。
# archive.yml / upload.yml から workflow_call で呼び出される。1 回の呼び出しで 1 つのプラットフォームを扱う。
#
# 認証はすべて App Store Connect API Key で行う（Apple ID / App 用パスワードは使わない）。
# アップロードは ExportOptions.plist の destination を upload にした xcodebuild -exportArchive で行う。
# iOS と macOS で同じ EXPORT_OPTIONS（method=app-store-connect）を使う。
# iOS はプロジェクト名と同名のスキーム、macOS は <プロジェクト名>Mac のスキーム（Mac アプリとカメラ拡張）を使う。
name: _archive

on:
  workflow_call:
    inputs:
      xcode-version:
        description: maxim-lobanov/setup-xcode に渡す Xcode バージョン
        type: string
        # README の Environment と揃える。ランナー側の更新でビルドが変わらないよう固定する
        default: '26.6'
      platform:
        description: アーカイブするプラットフォーム（iOS / macOS）
        type: string
        default: iOS
      upload:
        description: Export したもの（IPA / pkg）を App Store Connect へアップロードするか
        type: boolean
        default: false
    secrets:
      EXPORT_OPTIONS:
        description: ExportOptions.plist の内容（destination と、アップロード時の manageAppVersionAndBuildNumber はワークフロー側で上書きする）
        required: true
      APPLE_API_KEY_BASE64:
        description: App Store Connect API Key（.p8）を base64 エンコードしたもの
        required: true
      APPLE_API_KEY_ID:
        description: App Store Connect API Key の Key ID
        required: true
      APPLE_API_ISSUER_ID:
        description: App Store Connect API Key の Issuer ID
        required: true

jobs:
  platform:
    # macOS のアップロードは、App Store Connect のアプリに macOS のプラットフォームが追加されているときだけ行う。
    # 追加は Web でしかできず、追加する前にアップロードすると毎回失敗するため、先に読み取りだけで確かめる。
    # 無ければ手順を Job Summary に出して archive を飛ばす（失敗にはしない）。macOS のランナーを使わないよう ubuntu で確かめる
    if: inputs.platform == 'macOS' && inputs.upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      available: ${{ steps.check.outputs.available }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create API private key
        # Secrets はシェル展開ではなく env 経由で渡す。鍵はリポジトリ配下ではなく RUNNER_TEMP に置く
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Check macOS platform in App Store Connect
        id: check
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
        run: |
          set -euo pipefail
          # Bundle ID は Configs/Project.xcconfig の APP_BUNDLE_IDENTIFIER（アーカイブの前なので xcarchive からは読めない）
          BUNDLE_ID=$(python3 Tools/app_store_config.py bundle-id) \
          PLATFORM=MAC_OS \
            ruby .github/scripts/check-app-store-platform.rb

  archive:
    needs: platform
    # platform を飛ばした（iOS・アップロードしない）ときと、macOS のプラットフォームがあったときだけ動く。
    # needs が skipped だと既定では後続も飛ぶので !cancelled() を付ける。platform が失敗したら available は空なので飛ぶ
    if: ${{ !cancelled() && (needs.platform.result == 'skipped' || needs.platform.outputs.available == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Allow SwiftLint build tool plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

      - name: Set up environment
        # iOS はプロジェクト名と同名、macOS は <プロジェクト名>Mac の共有スキームが存在することを前提にする。
        # ExportOptions.plist と API 秘密鍵はリポジトリ配下ではなく RUNNER_TEMP に置く
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          project=$(basename -s .xcodeproj ./*.xcodeproj)
          case "$PLATFORM" in
            iOS) scheme=$project; package_extension=ipa ;;
            macOS) scheme=${project}Mac; package_extension=pkg ;;
            *)
              echo "::error::platform は iOS か macOS を指定してください（${PLATFORM}）"
              exit 1
              ;;
          esac
          {
            echo "PROJECT_NAME=$project"
            echo "SCHEME=$scheme"
            echo "PACKAGE_EXTENSION=$package_extension"
            echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist"
            echo "API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          } >> "$GITHUB_ENV"
          echo "project=$project scheme=$scheme platform=$PLATFORM package=$package_extension"

      - name: Create ExportOptions.plist and API private key
        # Secrets はシェル展開ではなく env 経由で渡す。macOS の Archive で API キーを使うので、Archive より前に置く
        env:
          EXPORT_OPTIONS: ${{ secrets.EXPORT_OPTIONS }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$EXPORT_OPTIONS" > "$EXPORT_OPTIONS_PATH"
          plutil -lint "$EXPORT_OPTIONS_PATH"
          mkdir -p "$(dirname "$API_KEY_PATH")"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$API_KEY_PATH"

      - name: Archive
        env:
          PLATFORM: ${{ inputs.platform }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ "$PLATFORM" = macOS ]; then
            # Mac アプリはカメラ拡張を有効にする entitlement（com.apple.developer.system-extension.install）と App Group を持ち、
            # これらはプロビジョニングプロファイルが無いと署名できない。アドホック署名（CODE_SIGN_IDENTITY=-）では
            # 「requires a provisioning profile」で Archive が止まるため（ローカルで確認）、App Store Connect API キーで自動署名して Archive する。
            # 配布用の署名（アプリとカメラ拡張の両方）は、iOS と同じく Export で行う
            xcodebuild archive \
              -project "$PROJECT_NAME.xcodeproj" \
              -scheme "$SCHEME" \
              -destination 'generic/platform=macOS' \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/build.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$API_KEY_PATH" \
              -authenticationKeyID "$APPLE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          else
            xcodebuild archive \
              -project "$PROJECT_NAME.xcodeproj" \
              -scheme "$SCHEME" \
              -sdk iphoneos \
              -configuration Release \
              -archivePath "$RUNNER_TEMP/build.xcarchive" \
              CODE_SIGNING_ALLOWED=NO
          fi

      - name: Export ${{ inputs.platform == 'macOS' && 'pkg' || 'IPA' }}
        # method=app-store-connect のまま、iOS は IPA、macOS は pkg（Mac Installer Distribution で署名）が出る
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string export "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"

      - name: Upload ${{ inputs.platform == 'macOS' && 'pkg' || 'IPA' }} to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PROJECT_NAME }}-${{ inputs.platform }}.${{ env.PACKAGE_EXTENSION }}
          path: ${{ runner.temp }}/export/*.${{ env.PACKAGE_EXTENSION }}
          if-no-files-found: error

      - name: Check app exists in App Store Connect
        # App Store Connect にアプリが無いと、アップロードが "Error Downloading App Information" で失敗し原因が分かりにくい。
        # アプリの作成は API でできないため、ここでは読み取りだけで確認し、無ければ作成手順を Job Summary に出して止める。
        # Bundle ID は直前の Export で Developer Portal に登録済みなので、この時点で Web 画面から選べる。
        # macOS は platform ジョブでアプリと macOS のプラットフォームを確かめ済みなので、iOS だけで行う
        if: ${{ inputs.upload && inputs.platform == 'iOS' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/build.xcarchive/Info.plist") \
          APP_NAME="$PROJECT_NAME" \
            ruby .github/scripts/check-app-store-app.rb

      - name: Set up TestFlight internal testers
        # 内部テストグループ（すべてのビルドを自動配信）を用意し、変数 TESTFLIGHT_INTERNAL_TESTERS のメールアドレスを内部テスターに入れる。
        # アップロードより前に済ませておくと、このあとのビルドも処理が終わりしだい配信される。2 回目以降は確認だけで何もしない。
        # テスターの設定に失敗してもアップロードは止めない（Job Summary と注釈で知らせる）
        if: ${{ inputs.upload }}
        continue-on-error: true
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TESTERS: ${{ vars.TESTFLIGHT_INTERNAL_TESTERS }}
        run: |
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' "$RUNNER_TEMP/build.xcarchive/Info.plist") \
            ruby .github/scripts/ensure-internal-testers.rb

      - name: Upload to App Store Connect
        # ビルド番号は Xcode に採番させる（manageAppVersionAndBuildNumber）。App Store Connect 上の最新ビルド番号を見て
        # 自動で増やすので、xcconfig の CURRENT_PROJECT_VERSION を手で上げる必要はない（iOS と macOS のビルドは別々に数える）。
        # org 共有の EXPORT_OPTIONS Secret は他リポジトリでも使うため書き換えず、ランナー上のコピーだけを上書きする
        if: ${{ inputs.upload }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          plutil -replace destination -string upload "$EXPORT_OPTIONS_PATH"
          plutil -replace manageAppVersionAndBuildNumber -bool YES "$EXPORT_OPTIONS_PATH"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
